apply plugin: 'com.android.application'

android {
    namespace 'com.flowia.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.flowia.app"
        minSdk 24          // Android 7.0 — covers 97%+ of active devices
        targetSdk 35       // Play Store mandatory as of August 2025
        versionCode 2
        versionName "1.1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            storeFile file('../flowia-release-key.jks')
            storePassword 'Flowia_Prod_RSA4096_Key_2026_SecPass!'
            keyAlias 'flowia_prod_key'
            keyPassword 'Flowia_Prod_RSA4096_Key_2026_SecPass!'
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            debuggable true
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Enable resource shrinking and linting
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // AndroidX Core & AppCompat
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'

    // WebKit — WebViewAssetLoader for secure asset loading
    implementation 'androidx.webkit:webkit:1.12.1'

    // Core KTX for back gesture support (Android 13+)
    implementation 'androidx.core:core:1.13.1'

    // Biometric for app lock
    implementation 'androidx.biometric:biometric:1.1.0'
}
