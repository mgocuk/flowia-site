[project]
name = "cyclecare_documentation_crew"
version = "0.1.0"
description = "cyclecare_documentation_crew using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[file-processing,litellm,tools]>=1.15.5,<2.0.0",
    "exa-py",
    "pydantic",
]

[project.scripts]
cyclecare_documentation_crew = "cyclecare_documentation_crew.main:run"
run_crew = "cyclecare_documentation_crew.main:run"
train = "cyclecare_documentation_crew.main:train"
replay = "cyclecare_documentation_crew.main:replay"
test = "cyclecare_documentation_crew.main:test"
run_with_trigger = "cyclecare_documentation_crew.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"

[tool.uv]
override-dependencies = ["litellm<=1.82.6"]
