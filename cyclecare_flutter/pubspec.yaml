name: cyclecare_flutter
description: "A femtech cycle tracking mobile app using Clean Architecture."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.0
  bloc: ^8.1.0  
  equatable: ^2.0.5
  get_it: ^7.6.0
  injectable: ^2.3.0
  dio: ^5.4.0
  retrofit: ^4.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.0.0
  go_router: ^13.0.0
  fl_chart: ^0.66.0
  intl: ^0.19.0
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.0
  firebase_messaging: ^14.7.0
  in_app_purchase: ^3.1.13
  cached_network_image: ^3.3.1
  image_picker: ^1.0.7
  shared_preferences: ^2.2.2
  connectivity_plus: ^6.0.2
  dartz: ^0.10.1
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  google_fonts: ^6.1.0
  lottie: ^3.0.0
  shimmer: ^3.0.0
  url_launcher: ^6.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.8
  injectable_generator: ^2.4.1
  freezed: ^2.4.7
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1
  retrofit_generator: ^8.1.0
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
